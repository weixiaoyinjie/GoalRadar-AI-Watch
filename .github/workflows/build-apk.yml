name: Build GoalRadar AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GoalRadarAI_v1_OneUpload.zip'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Expand one-upload source
        shell: bash
        run: |
          if [ -f GoalRadarAI_v1_OneUpload.zip ]; then
            unzip -o GoalRadarAI_v1_OneUpload.zip -d .
          fi
          test -f settings.gradle
          test -f app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GoalRadarAI-v1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GoalRadarAI-v1-debug
          path: dist/GoalRadarAI-v1-debug.apk
          retention-days: 14
