name: Build GoalRadar AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GoalRadarAI_v1_OneUpload.zip'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand uploaded Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f GoalRadarAI_v1_OneUpload.zip ]; then
            # Keep the actual checked-in workflow; do not unpack the old copy.
            unzip -qo GoalRadarAI_v1_OneUpload.zip -d . -x '.github/workflows/*'
          fi
          test -f settings.gradle
          test -f app/build.gradle
          echo 'Android source files are ready.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          # GitHub ubuntu-24.04 runners normally have API 35 and Build Tools 35.
          # Only call the already-preinstalled sdkmanager if a package is missing.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo 'Android API 35 and Build Tools 35.0.0 are ready.'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GoalRadarAI-v1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalRadarAI-v1-debug
          path: dist/GoalRadarAI-v1-debug.apk
          if-no-files-found: error
          retention-days: 14
