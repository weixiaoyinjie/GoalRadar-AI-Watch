name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub Ubuntu runner already includes the Android SDK.
      # Avoid android-actions/setup-android, whose command-line tools
      # version check can trigger a failing re-download.
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT" || { echo 'Android SDK directory missing'; exit 1; }
          ls -la "$ANDROID_SDK_ROOT" | head -n 30

      - name: Unpack uploaded project ZIP if needed
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name gradlew -not -path './.git/*' -print -quit | grep -q .; then
            echo 'Gradle wrapper already exists; no ZIP extraction needed.'
            exit 0
          fi
          shopt -s nullglob
          preferred=( ./*OneUpload*.zip )
          all_zips=( ./*.zip )
          if (( ${#preferred[@]} > 0 )); then
            archive="${preferred[0]}"
          elif (( ${#all_zips[@]} > 0 )); then
            archive="${all_zips[0]}"
          else
            echo 'No gradlew and no ZIP found in repository root.'
            exit 1
          fi
          echo "Extracting $archive"
          mkdir -p "$RUNNER_TEMP/android-project"
          unzip -q -o "$archive" -d "$RUNNER_TEMP/android-project"

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(find "$GITHUB_WORKSPACE" "$RUNNER_TEMP/android-project" \
            -type f -name gradlew -not -path '*/.git/*' -print -quit 2>/dev/null || true)"
          if [[ -z "$wrapper" ]]; then
            echo 'Could not find gradlew. ZIP must include an Android Gradle project and its wrapper.'
            exit 1
          fi
          project_dir="$(dirname "$(realpath "$wrapper")")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Android project: $project_dir"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-debug-APK
          path: |
            **/build/outputs/apk/**/*.apk
            ${{ runner.temp }}/android-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
